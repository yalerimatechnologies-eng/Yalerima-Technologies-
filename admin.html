<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — Yalerima Technologies</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/admin-style.css">
    
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">

    <!-- Background Effects -->
    <div class="auth-bg">
        <div class="auth-grid"></div>
        <div class="auth-glow auth-glow-1"></div>
        <div class="auth-glow auth-glow-2"></div>
    </div>

    <!-- Login Container -->
    <div class="auth-container">
        
        <!-- Logo -->
        <div class="auth-logo">
            <img src="assets/images/logo.png" alt="Yalerima Technologies" class="auth-logo-img">
            <div class="auth-logo-text">
                <span class="auth-logo-name">YALERIMA</span>
                <span class="auth-logo-tagline">ADMINISTRATION</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Sign in to access the enterprise dashboard</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form" novalidate>
                
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email" class="form-label">
                        <span>Email Address</span>
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="admin@yalerima.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <span class="form-error" id="emailError"></span>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password" class="form-label">
                        <span>Password</span>
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span class="form-error" id="passwordError"></span>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="checkbox-label">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader" style="display: none;">
                        <svg class="spinner" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>

                <!-- Error Message -->
                <div class="auth-alert auth-alert-error" id="authError" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="12" y1="16" x2="12.01" y2="16"/>
                    </svg>
                    <span id="authErrorMessage"></span>
                </div>

                <!-- Success Message -->
                <div class="auth-alert auth-alert-success" id="authSuccess" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    <span id="authSuccessMessage"></span>
                </div>

            </form>

            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" class="auth-form" style="display: none;" novalidate>
                <div class="auth-header">
                    <h2>Reset Password</h2>
                    <p>Enter your email to receive a reset link</p>
                </div>

                <div class="form-group">
                    <label for="resetEmail" class="form-label">
                        <span>Email Address</span>
                        <span class="required">*</span>
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                        <input 
                            type="email" 
                            id="resetEmail" 
                            name="resetEmail" 
                            class="form-input" 
                            placeholder="admin@yalerima.com"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
                    <span class="btn-text">Send Reset Link</span>
                    <span class="btn-loader" style="display: none;">
                        <svg class="spinner" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round"/>
                        </svg>
                    </span>
                </button>

                <button type="button" class="btn btn-ghost btn-full" id="backToLoginBtn">
                    Back to Login
                </button>
            </form>

        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>&copy; 2026 Yalerima Technologies. Enterprise Administration Portal.</p>
            <a href="index.html" class="back-to-site">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                Back to Website
            </a>
        </div>

    </div>

    <script src="assets/supabase.js"></script>
    <script src="assets/admin-script.js"></script>
    <script>
        // Login page specific logic
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const forgotPasswordForm = document.getElementById('forgotPasswordForm');
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            const backToLoginBtn = document.getElementById('backToLoginBtn');
            const passwordToggle = document.getElementById('passwordToggle');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const resetBtn = document.getElementById('resetBtn');

            // Toggle password visibility
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                passwordToggle.querySelector('.icon-eye').style.display = type === 'password' ? 'block' : 'none';
                passwordToggle.querySelector('.icon-eye-off').style.display = type === 'password' ? 'none' : 'block';
            });

            // Toggle between login and forgot password forms
            forgotPasswordLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginForm.style.display = 'none';
                forgotPasswordForm.style.display = 'block';
            });

            backToLoginBtn.addEventListener('click', () => {
                forgotPasswordForm.style.display = 'none';
                loginForm.style.display = 'block';
            });

            // Login form submission
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                // Clear errors
                document.getElementById('emailError').textContent = '';
                document.getElementById('passwordError').textContent = '';
                document.getElementById('authError').style.display = 'none';

                // Validation
                let valid = true;
                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById('emailError').textContent = 'Please enter a valid email address';
                    valid = false;
                }
                if (!password || password.length < 6) {
                    document.getElementById('passwordError').textContent = 'Password must be at least 6 characters';
                    valid = false;
                }

                if (!valid) return;

                // Show loading state
                loginBtn.disabled = true;
                loginBtn.querySelector('.btn-text').style.display = 'none';
                loginBtn.querySelector('.btn-loader').style.display = 'inline-flex';

                try {
                    const result = await SupabaseClient.Auth.signIn(email, password);
                    
                    if (result.success) {
                        // Check user role
                        const role = await SupabaseClient.Auth.getUserRole();
                        
                        if (role === 'super_admin' || role === 'admin') {
                            // Successful login
                            document.getElementById('authSuccess').style.display = 'flex';
                            document.getElementById('authSuccessMessage').textContent = 'Login successful! Redirecting...';
                            
                            setTimeout(() => {
                                window.location.href = 'super-admin.html';
                            }, 1000);
                        } else {
                            throw new Error('Access denied. Admin privileges required.');
                        }
                    } else {
                        throw new Error(result.error || 'Login failed');
                    }
                } catch (error) {
                    document.getElementById('authError').style.display = 'flex';
                    document.getElementById('authErrorMessage').textContent = error.message;
                    
                    // Reset button state
                    loginBtn.disabled = false;
                    loginBtn.querySelector('.btn-text').style.display = 'inline';
                    loginBtn.querySelector('.btn-loader').style.display = 'none';
                }
            });

            // Forgot password form submission
            forgotPasswordForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('resetEmail').value.trim();

                if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    alert('Please enter a valid email address');
                    return;
                }

                // Show loading state
                resetBtn.disabled = true;
                resetBtn.querySelector('.btn-text').style.display = 'none';
                resetBtn.querySelector('.btn-loader').style.display = 'inline-flex';

                try {
                    const result = await SupabaseClient.Auth.resetPassword(email);
                    
                    if (result.success) {
                        alert('Password reset link sent! Check your email.');
                        forgotPasswordForm.style.display = 'none';
                        loginForm.style.display = 'block';
                    } else {
                        throw new Error(result.error || 'Failed to send reset link');
                    }
                } catch (error) {
                    alert(error.message);
                } finally {
                    resetBtn.disabled = false;
                    resetBtn.querySelector('.btn-text').style.display = 'inline';
                    resetBtn.querySelector('.btn-loader').style.display = 'none';
                }
            });

            // Check if already authenticated
            (async () => {
                const isAuthenticated = await SupabaseClient.Auth.isAuthenticated();
                if (isAuthenticated) {
                    const role = await SupabaseClient.Auth.getUserRole();
                    if (role === 'super_admin' || role === 'admin') {
                        window.location.href = 'super-admin.html';
                    }
                }
            })();
        });
    </script>
</body>
</html>
