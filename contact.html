<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact | Yalerima Technologies</title>
<link rel="icon" href="assets/images/logo.png">
<style>
:root{
--bg:#080a0c;
--surface:#151a1f;
--surface2:#1c2228;
--text:#f5f5f5;
--text-soft:#b8bcbc;
--accent:#d8ff5a;
--accent2:#b7e83b;
--line:rgba(255,255,255,.08);
--radius:28px;
--shadow:0 30px 80px rgba(0,0,0,.45);
--font:Inter,Arial,sans-serif;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:var(--font);
background:var(--bg);
color:var(--text);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:60px 20px;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:700px;
height:700px;
border-radius:50%;
background:radial-gradient(circle,var(--accent) 0%,transparent 70%);
opacity:.08;
filter:blur(60px);
animation:float 8s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-40px) translateX(20px);
}
}

.card{
width:min(900px,100%);
background:rgba(21,26,31,.85);
backdrop-filter:blur(25px);
border:1px solid var(--line);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:50px;
animation:show .8s ease;
}

@keyframes show{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:none;
}
}

.logo{
width:120px;
height:120px;
margin:auto;
border-radius:50%;
background:var(--surface2);
display:grid;
place-items:center;
border:3px solid var(--accent);
box-shadow:0 0 40px rgba(216,255,90,.15);
margin-bottom:25px;
overflow:hidden;
}

.logo img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
display:block;
}

h1{
text-align:center;
font-size:42px;
margin-bottom:12px;
}

p{
text-align:center;
color:var(--text-soft);
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.field{
display:flex;
flex-direction:column;
gap:10px;
}

.field.full{
grid-column:1/-1;
}

label{
font-size:13px;
font-weight:700;
color:var(--text-soft);
}

input,
select,
textarea{
width:100%;
padding:16px;
border-radius:16px;
border:1px solid var(--line);
background:var(--surface);
color:var(--text);
outline:none;
transition:.3s;
}

input:focus,
select:focus,
textarea:focus{
border-color:var(--accent);
box-shadow:0 0 20px rgba(216,255,90,.1);
}

textarea{
min-height:180px;
resize:vertical;
}

.type-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.type{
background:var(--surface);
border:1px solid var(--line);
padding:18px;
border-radius:18px;
cursor:pointer;
transition:.3s;
display:flex;
gap:10px;
align-items:center;
}

.type:hover{
border-color:var(--accent);
transform:translateY(-3px);
}

button{
margin-top:30px;
width:100%;
height:58px;
border:none;
border-radius:100px;
background:var(--accent);
color:#111;
font-weight:800;
font-size:17px;
cursor:pointer;
transition:.35s;
}

button:hover{
background:var(--accent2);
transform:translateY(-3px);
}

button:disabled{
opacity:.6;
cursor:not-allowed;
transform:none;
}

.footer{
margin-top:30px;
text-align:center;
font-size:13px;
color:var(--text-soft);
}

#status{
margin-top:16px;
text-align:center;
font-size:14px;
color:var(--text-soft);
min-height:18px;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
backdrop-filter:blur(8px);
display:none;
align-items:center;
justify-content:center;
z-index:999;
padding:20px;
}

.overlay.show{
display:flex;
}

.success-card{
width:min(380px,100%);
background:var(--surface2);
border:1px solid var(--line);
border-radius:24px;
padding:45px 35px;
text-align:center;
box-shadow:var(--shadow);
animation:show .4s ease;
}

.success-icon{
width:72px;
height:72px;
border-radius:50%;
background:var(--accent);
display:grid;
place-items:center;
margin:0 auto 22px;
font-size:34px;
font-weight:800;
color:#111;
}

.success-card h2{
font-size:24px;
margin-bottom:10px;
}

.success-card p{
color:var(--text-soft);
font-size:14px;
margin-bottom:28px;
}

.success-card button{
margin-top:0;
}

@media(max-width:760px){

.card{
padding:30px;
}

.grid{
grid-template-columns:1fr;
}

.type-grid{
grid-template-columns:1fr;
}

h1{
font-size:32px;
}

}
</style>
</head>
<body>
<div class="card">
<div class="logo">
<img src="assets/images/logo.png" alt="Yalerima Technologies logo">
</div>
<h1>Contact Yalerima Technologies</h1>
<p>
Tell us how we can help you today.
</p>
<form id="contactForm">
<div class="field full">
<label>What brings you here?</label>

<div class="type-grid">
<label class="type">
<input type="radio" name="request_type" value="Project Request" required>
Project Request
</label>
<label class="type">
<input type="radio" name="request_type" value="Hiring Yalerima">
Hiring Us
</label>
<label class="type">
<input type="radio" name="request_type" value="Job Application">
Job Application
</label>
<label class="type">
<input type="radio" name="request_type" value="Complaint">
Complaint
</label>
<label class="type">
<input type="radio" name="request_type" value="Partnership">
Partnership
</label>
<label class="type">
<input type="radio" name="request_type" value="General Inquiry">
General Inquiry
</label>
</div>
</div>
<div class="grid">
<div class="field">
<label>Full Name</label>
<input type="text" id="fullname" required>
</div>
<div class="field">
<label>Email Address</label>
<input type="email" id="email" required>
</div>
<div class="field">
<label>Phone Number</label>
<input type="tel" id="phone">
</div>
<div class="field">
<label>Company / Organization</label>
<input type="text" id="company">
</div>
<div class="field full">
<label>Project / Subject</label>
<input type="text" id="subject">
</div>
<div class="field">
<label>Estimated Budget</label>
<select id="budget">
<option>Not Specified</option>
<option>Under $500</option>
<option>$500 - $2,000</option>
<option>$2,000 - $10,000</option>
<option>$10,000+</option>
</select>
</div>
<div class="field">
<label>Timeline</label>

<select id="timeline">
<option>Immediately</option>
<option>1 Week</option>
<option>1 Month</option>
<option>Flexible</option>
</select>
</div>
<div class="field full">
<label>Tell us about your request</label>

<textarea id="message" placeholder="Describe your project, complaint, partnership, or job request..."></textarea>
</div>
<div class="field">
<label>Upload File</label>

<input type="file" id="attachment">
</div>
<div class="field">
<label>Preferred Contact</label>

<select id="preferred">
<option>Email</option>
<option>WhatsApp</option>
<option>Phone Call</option>
</select>
</div>
<div class="field full">
<label>
<input type="checkbox" required>
I agree that my information may be used by Yalerima Technologies to respond to this request.
</label>
</div>
</div>
<button type="submit" id="submitBtn">
Send Request
</button>
<div id="status"></div>
</form>
<div class="footer">
Powered by SB • Secure Business Integration
</div>
</div>

<div class="overlay" id="successOverlay">
<div class="success-card">
<div class="success-icon">✓</div>
<h2>Request Sent Successfully</h2>
<p>Thank you for reaching out. Our team at Yalerima Technologies has received your request and will get back to you shortly.</p>
<button type="button" id="closeSuccess">Close</button>
</div>
</div>

<!-- contact.html -->
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://yisuubdanhisuzxkgufn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_PWEvImisbMTuE2y64i75rg_WJeFwEKU";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

const form = document.getElementById("contactForm");
const submit = document.getElementById("submitBtn");
const status = document.getElementById("status");

const uploadInput = document.getElementById("attachment");

const successOverlay = document.getElementById("successOverlay");
const closeSuccess = document.getElementById("closeSuccess");

closeSuccess.addEventListener("click", ()=>{
    successOverlay.classList.remove("show");
});

successOverlay.addEventListener("click", (e)=>{
    if(e.target === successOverlay){
        successOverlay.classList.remove("show");
    }
});

form.addEventListener("submit", async (e)=>{

    e.preventDefault();

    submit.disabled = true;
    submit.innerHTML = "Sending...";

    status.innerHTML = "";

    const requestTypeEl = document.querySelector("[name=request_type]:checked");

    if(!requestTypeEl){
        status.innerHTML = "Please select what brings you here.";
        submit.disabled = false;
        submit.innerHTML = "Send Request";
        return;
    }

    let attachmentUrl = null;

    if(uploadInput.files.length){

        const file = uploadInput.files[0];

        const fileName =
        `${Date.now()}-${file.name}`;

        const { error:uploadError } =
        await supabase.storage
        .from("contact-files")
        .upload(fileName,file);

        if(uploadError){

            status.innerHTML =
            uploadError.message;

            submit.disabled=false;
            submit.innerHTML="Send Request";

            return;
        }

        const { data } =
        supabase.storage
        .from("contact-files")
        .getPublicUrl(fileName);

        attachmentUrl =
        data.publicUrl;

    }

    const payload = {

        request_type:
        requestTypeEl.value,

        fullname:
        document.getElementById("fullname").value,

        email:
        document.getElementById("email").value,

        phone:
        document.getElementById("phone").value,

        company:
        document.getElementById("company").value,

        subject:
        document.getElementById("subject").value,

        budget:
        document.getElementById("budget").value,

        timeline:
        document.getElementById("timeline").value,

        preferred_contact:
        document.getElementById("preferred").value,

        message:
        document.getElementById("message").value,

        attachment:
        attachmentUrl,

        created_at:
        new Date().toISOString()

    };

    const { error } =
    await supabase
    .from("contact_requests")
    .insert([payload]);

    if(error){

        status.innerHTML =
        error.message;

        submit.disabled=false;
        submit.innerHTML="Send Request";

        return;

    }

    form.reset();

    submit.disabled=false;
    submit.innerHTML="Send Request";

    successOverlay.classList.add("show");

});
</script>
</body>
</html>
